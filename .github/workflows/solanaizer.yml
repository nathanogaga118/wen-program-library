name: Solana Security Audit

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Install Dependencies
        run: |
          sudo apt update
          sudo apt install -y python3-pip
          pip3 install solanaizer  # Ensure Solanaizer is a valid PyPi package

      - name: Run Solanaizer Audit
        run: |
          solanaizer --scan ./programs --output report.json
          
      - name: Upload Audit Report
        uses: actions/upload-artifact@v3
        with:
          name: solanaizer-report
          path: report.json
